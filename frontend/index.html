<!doctype html>
<!-- HeroUI reads the theme from this class -->
<html lang="he" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the bottom bar can sit inside the home-indicator inset -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFAF3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="ארכיון מדבקות זיכרון — שומרים את הפנים, השמות והמילים של הנופלים, באור ולאורך זמן."
    />
    <title>שירת הסטיקר — ארכיון מדבקות זיכרון</title>

    <!-- The archive has one canonical address; nginx redirects www and plain HTTP
         to it, and this says the same thing to anything that only reads HTML. -->
    <link rel="canonical" href="https://stkrmem.com/" />

    <!-- What a shared link looks like. Most of the archive is passed around in
         messaging apps, so a link that unfurls with the name and a line about
         what this is does more for it than anything else in this file. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="שירת הסטיקר" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://stkrmem.com/" />
    <meta property="og:title" content="שירת הסטיקר — ארכיון מדבקות זיכרון" />
    <meta
      property="og:description"
      content="ארכיון מדבקות זיכרון — שומרים את הפנים, השמות והמילים של הנופלים, באור ולאורך זמן."
    />
    <meta property="og:image" content="https://stkrmem.com/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />

    <!-- An olive leaf on parchment. .ico covers browsers without SVG icon support. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600&family=David+Libre:wght@400;500;700&family=Suez+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
