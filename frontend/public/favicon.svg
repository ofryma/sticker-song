<!--
  הקיר זוכר — the mark is the yahrzeit flame from <Candle>, alone in the night.
  Colors are the design tokens: night #0A0F1C, flame-warm #E39B4A,
  flame-glow #FFE9BE, stone-300 #C8BCA6 for the wall seam.
  Drawn on a 64px grid; every detail has to survive being seen at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="56%" r="46%">
      <stop offset="0%" stop-color="#F0BE6B" stop-opacity=".38" />
      <stop offset="55%" stop-color="#E39B4A" stop-opacity=".12" />
      <stop offset="100%" stop-color="#E39B4A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#0A0F1C" />

  <!-- The wall the stickers live on: one seam, barely there. -->
  <path d="M6 50h52" stroke="#C8BCA6" stroke-opacity=".16" stroke-width="1.4" />

  <!-- Candlelight spilling into the dark. -->
  <circle cx="32" cy="33" r="29" fill="url(#halo)" />

  <!-- Flame. Narrower and sharper at the tip than <Candle>'s: at 16px a wide
       flame collapses into a blob, and the taper is what makes it legible. -->
  <path
    d="M32 6.9c8.1 10.7 11.8 18.8 11.8 26.7 0 8.7-5.4 15.4-11.8 15.4s-11.8-6.7-11.8-15.4c0-7.9 3.7-16 11.8-26.7z"
    fill="#E39B4A"
  />
  <path
    d="M32 22.3c3.4 4.7 4.9 8.4 4.9 11.5 0 3.6-2.2 6.4-4.9 6.4s-4.9-2.8-4.9-6.4c0-3.1 1.5-6.8 4.9-11.5z"
    fill="#FFE9BE"
  />
</svg>
