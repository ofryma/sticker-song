<!--
  שירת הסטיקר — the mark is the olive leaf from <Sprig>: one leaf, in daylight.
  Colors are the design tokens: day #FDFAF3, olive #6B8F3F, olive-deep #47661F,
  sun #E0A03C for the light behind it.
  Drawn on a 64px grid; every detail has to survive being seen at 16px, which is
  why it is a single leaf and not a branch.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="light" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#E0A03C" stop-opacity=".30" />
      <stop offset="60%" stop-color="#E0A03C" stop-opacity=".10" />
      <stop offset="100%" stop-color="#E0A03C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#FDFAF3" />

  <!-- Daylight pooling behind the leaf. -->
  <circle cx="32" cy="30" r="29" fill="url(#light)" />

  <!-- The wall the stickers live on: one seam, barely there. -->
  <path d="M6 52h52" stroke="#47661F" stroke-opacity=".14" stroke-width="1.4" />

  <!-- Stem first, then the leaf over it, so the join stays clean when small. -->
  <path
    d="M32 52V33"
    stroke="#47661F"
    stroke-opacity=".85"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <path d="M32 9c11.6 11.4 11.6 25.9 0 37.4C20.4 34.9 20.4 20.4 32 9z" fill="#6B8F3F" />
  <!-- Midrib. At 16px it reads as shading rather than a line, and that is what
       keeps the leaf from flattening into a blob. -->
  <path
    d="M32 12.5v30"
    stroke="#47661F"
    stroke-opacity=".55"
    stroke-width="1.6"
    stroke-linecap="round"
  />
</svg>
