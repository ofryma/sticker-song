# Serves the built SPA inside the frontend image. Public traffic does not reach
# this directly — the edge proxy in nginx/conf.d/default.conf sits in front.

# The scheme the visitor used. TLS is terminated at the edge, so $scheme here is
# always http; the edge forwards the real one in X-Forwarded-Proto.
map $http_x_forwarded_proto $public_scheme {
    default    $scheme;
    "~^(https?)$" $1;
}

# Disallow in robots.txt keeps a crawler from fetching the review queue; this
# keeps it out of an index even if someone links to it from outside. An empty
# value means nginx sends no header at all, which is what every other route
# wants.
map $request_uri $robots_tag {
    default          "";
    "~^/admin(/|\?|$)" "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed filenames here, so these can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt and sitemap.xml are written here rather than shipped in public/
    # because both need the site's absolute origin, and the image is built once
    # in CI without knowing the domain it will be deployed under. $host is the
    # domain the visitor actually asked for, passed through by the edge proxy.
    #
    # The review queue at /admin is kept out of both: it is unlinked, it needs a
    # sign-in, and it has nothing for a reader. /api/ serves images and JSON, not
    # pages. Everything else is public and worth indexing.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        return 200 "User-agent: *\nAllow: /\nDisallow: /admin\nDisallow: /api/\n\nSitemap: $public_scheme://$host/sitemap.xml\n";
    }

    # The four routes in App.jsx that a reader can reach. Entries live inside the
    # wall rather than on URLs of their own, so there is nothing per-entry to
    # list. No <lastmod>: a hardcoded date would only ever be wrong.
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>$public_scheme://$host/</loc><priority>1.0</priority></url>\n  <url><loc>$public_scheme://$host/wall</loc><priority>0.9</priority></url>\n  <url><loc>$public_scheme://$host/about</loc><priority>0.6</priority></url>\n  <url><loc>$public_scheme://$host/contribute</loc><priority>0.6</priority></url>\n</urlset>\n';
    }

    # Client-side routing: unknown paths render the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every route arrives here after the try_files redirect above, so the tag has
    # to be chosen from $request_uri — the path the visitor actually asked for.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag;
    }
}
