name: Deploy

# Ships the stack files to the single production server over SSH and asks it to
# pull the images and restart. Nothing is built here — the images come from
# docker-images.yml, which calls this workflow after a merge to main.
#
# Manual runs: Actions → Deploy → "Run workflow", optionally with an image tag
# (`main`, `v1.2.3`, `sha-<full sha>`) to deploy or roll back to a specific build.
#
# Repository secrets:
#   DEPLOY_HOST         server address (e.g. 203.0.113.10 or stickers.example.com)
#   DEPLOY_USER         ssh user with docker permissions
#   DEPLOY_SSH_KEY      private key (the matching public key is in the user's
#                       ~/.ssh/authorized_keys on the server)
#   DEPLOY_KNOWN_HOSTS  optional; output of `ssh-keyscan <host>`. When unset the
#                       key is scanned at deploy time (trust on first use).
# Repository variables:
#   DEPLOY_PATH         checkout directory on the server (default /opt/sticker-song)

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to deploy
        type: string
        required: true
      app_version:
        description: Version the image should report, checked after it starts
        type: string
        required: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (main, 1.2.3, sha-<full sha>)"
        type: string
        required: true
        default: main

# One deploy at a time; a queued newer deploy waits rather than racing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.image_tag }} → production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sticker-song' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            ServerAliveInterval 20
          EOF

      # Fail fast, before anything is shipped or restarted: the server needs the
      # tools the later steps call, and the .env the compose file reads. That
      # .env is deliberately never shipped from CI, so a first-ever deploy has
      # to be bootstrapped by hand from .env.prod.example.
      - name: Check server prerequisites
        run: |
          set -euo pipefail
          ssh production bash -euo pipefail -s "'$DEPLOY_PATH'" <<'REMOTE'
          path="$1"
          for cmd in make tar docker; do
            command -v "$cmd" >/dev/null \
              || { echo "::error::$cmd is not installed on the deploy host"; exit 1; }
          done
          docker compose version >/dev/null \
            || { echo "::error::the docker compose v2 plugin is unavailable"; exit 1; }
          [ -f "$path/.env" ] \
            || { echo "::error::$path/.env is missing — create it from .env.prod.example"; exit 1; }
          # nginx renders its templates with DOMAIN, and compose refuses to start
          # without it. Catch that here rather than half way through a restart.
          grep -q '^DOMAIN=.' "$path/.env" \
            || { echo "::error::DOMAIN is not set in $path/.env"; exit 1; }
          REMOTE

      # Only the files the server actually runs: the compose file, the Makefile
      # that drives it, and the edge config nginx mounts — templates (rendered
      # with DOMAIN from the server's .env at container start) and the includes
      # they pull in. The server's .env, nginx/certs, letsencrypt/ and volumes
      # are never touched. tar over ssh so the server needs nothing but tar — no
      # rsync, no git checkout to keep in sync.
      - name: Ship stack files
        run: |
          set -euo pipefail
          ssh production "mkdir -p '$DEPLOY_PATH'"
          tar -czf - docker-compose.prod.yml Makefile nginx/templates nginx/include \
            | ssh production "tar -xzf - -C '$DEPLOY_PATH'"

      # A token scoped to this run, valid only while it lasts — no long-lived PAT
      # sitting in the server's docker config. Needed because the packages are
      # private; harmless if they are public.
      - name: Log the server in to GHCR
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | ssh production "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull and restart
        run: |
          set -euo pipefail
          ssh production bash -euo pipefail -s <<EOF
          cd '$DEPLOY_PATH'
          # The tag the stack runs, recorded next to it: a later manual
          # \`make prod-up\` on the box redeploys this same version.
          printf 'IMAGE_TAG=%s\n' '$IMAGE_TAG' > .image-tag
          make prod-deploy
          EOF

      - name: Wait for the stack to come back healthy
        run: |
          set -euo pipefail
          ssh production "cd '$DEPLOY_PATH' && make prod-health"

      # The version is baked into the image, so asking the running container for
      # it is what proves the deploy replaced anything at all — a pull that
      # silently resolved to the old digest would pass every check above this one.
      - name: Confirm the running version
        if: inputs.app_version != ''
        env:
          EXPECTED: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          running=$(ssh production "cd '$DEPLOY_PATH' && make --no-print-directory prod-version")
          echo "expected $EXPECTED, running $running"
          [ "$running" = "$EXPECTED" ] || {
            echo "::error::the stack is serving $running, not $EXPECTED"
            exit 1
          }

      # The token above dies with this run, and a dead token in the server's
      # docker config is worse than no token at all: the registry answers
      # "denied" instead of falling back to anonymous, so every later
      # `make prod-up` on the box fails to pull. Both packages are public, so
      # logging out is what keeps a hand-run deploy working.
      - name: Log the server back out of GHCR
        if: always()
        run: ssh production "docker logout ghcr.io" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy \`$IMAGE_TAG\`"
            echo
            echo "- version: \`${{ inputs.app_version || 'not given' }}\`"
            echo "- host: \`$DEPLOY_HOST\`"
            echo "- path: \`$DEPLOY_PATH\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Says so in the ops channel, either way. A deploy that failed half way is
      # the one worth hearing about, so this runs on any outcome and never fails
      # the job itself — a missing token means no message, not a red deploy.
      - name: Tell Telegram how it went
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          VERSION: ${{ inputs.app_version || 'not given' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The address a person would open, which is the domain and not
          # DEPLOY_HOST — that is an IP, and its certificate is for the domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://stkrmem.com' }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "no Telegram credentials configured; skipping"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            text="<b>Deploy finished</b>

          Version <code>$VERSION</code> is live on <a href=\"$SITE_URL\">production</a>.
          Image <code>$IMAGE_TAG</code>."
          else
            text="<b>Deploy $STATUS</b>

          Version <code>$VERSION</code> (image <code>$IMAGE_TAG</code>) did not go out.
          The stack is running whatever it was running before.
          <a href=\"$RUN_URL\">See the run</a>"
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true \
            -o /dev/null || echo "::warning::could not notify Telegram"
