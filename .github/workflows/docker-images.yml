name: CI

# Lints and tests both halves, then pushes ghcr.io/<owner>/<repo>/backend and
# .../frontend. Pull requests build both images to catch breakage, but publish
# nothing. Nothing is published unless the checks pass first.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to advance"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration tests create this database themselves and install
      # pg_trgm into it; they skip if it is unreachable, so the URL has to work.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/stickers_test
      # tests/test_storage.py drives the real MinIO client; same deal, it skips
      # when nothing is listening, so the endpoint has to work.
      TEST_MINIO_ENDPOINT: localhost:9010
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11" # matches the version the Dockerfile pins
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is stale rather than quietly re-resolving.
        # The Dockerfile installs with --frozen, so a stale lock would mean the
        # image and the tests disagree about what is installed.
        run: uv sync --locked

      # Not a service container: MinIO needs `server /data` as its command, and
      # `services:` cannot set one. Same image and ports as docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9010/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not come up" >&2
          docker logs minio >&2
          exit 1

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        # These turn the integration tests' self-skip into a failure: on CI an
        # unreachable Postgres or MinIO is a broken job, not a pass.
        env:
          REQUIRE_DATABASE: "1"
          REQUIRE_STORAGE: "1"
        run: uv run pytest -v --strict-markers

  frontend:
    name: Frontend — eslint + prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Frontend rules (300-line limit, he/en key parity)
        run: npm run check:rules

      - name: Vitest (draft flow, duplicate review)
        run: npm run test

      - name: Build
        run: npm run build

  # The version counter. Git tags are the record — nothing to edit in a file, so
  # nothing to conflict on merge — and this reads the last one and advances it.
  # A merge to main takes the patch; minor and major are asked for by hand, in
  # Actions → CI → "Run workflow".
  #
  # It runs after the two check jobs, so a version is only ever spent on a commit
  # that passed. The tag is pushed with the default GITHUB_TOKEN, and GitHub does
  # not start workflow runs from that token, which is what keeps this from
  # triggering itself through the `tags: ["v*"]` filter above.
  version:
    name: Version
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # Unshallow, or there are no tags to read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # `sort -V` over the numeric tags only, so a v1.10.0 sorts above v1.9.0
          # and a stray `v-something` cannot become the latest.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<<"${latest#v}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac

          # A tag that already exists means a version was spent on a run that
          # did not finish, or two landed at once. Step over it rather than
          # failing the build: the number is a counter, not a promise that none
          # are skipped.
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          version="$major.$minor.$patch"

          # A pull request gets a version to build with but never a tag: nothing
          # is released from a branch that has not landed.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="$version-pr${{ github.event.number }}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "$latest → v$version (bump: $BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  build:
    name: Images
    needs: [backend, frontend, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
            # Only the backend is asked which version it is, so only the backend
            # is told. Passing it to an image whose Dockerfile declares no such
            # ARG earns a warning and nothing else.
            version_arg: true
          - name: frontend
            context: ./frontend
            target: prod
            version_arg: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            # The version this run just took. The semver lines above only fire on
            # a tag *event*, and CI's own tag deliberately raises none, so this is
            # what actually puts 1.4.2 on the image.
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          # Add linux/arm64 here if the server is ARM; it roughly doubles build time.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ matrix.version_arg && format('APP_VERSION={0}', needs.version.outputs.version) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Every merge to main goes straight out, pinned to this commit's images rather
  # than the moving `main` tag, so the deploy and any rollback name one build.
  # A hand-started run on main deploys too, which is what makes asking for a
  # minor or major bump a single click rather than a bump followed by a deploy.
  # Deploying an *older* build is still Actions → Deploy → "Run workflow".
  deploy:
    name: Deploy
    needs: [build, version]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: sha-${{ github.sha }}
      app_version: ${{ needs.version.outputs.version }}
    secrets: inherit
