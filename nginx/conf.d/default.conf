# Edge proxy for the single-server deployment. One public port: the SPA at /,
# the FastAPI app under /api/ (the prefix is stripped before it reaches uvicorn,
# which matches how Vite proxies /api in development).

# Docker's embedded DNS. Resolving upstreams per request — via the $frontend and
# $backend variables below — means a restarted container is picked up without
# restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Uploads are capped at 10 MB by the API; leave headroom for the multipart
    # envelope so the API returns its own error rather than an nginx 413.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Liveness for the host or an uptime check, answered without touching the app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image responses stream out of MinIO through the API; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

