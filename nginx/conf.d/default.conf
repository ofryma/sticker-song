# Edge proxy for the single-server deployment. One public port: the SPA at /,
# the FastAPI app under /api/ (the prefix is stripped before it reaches uvicorn,
# which matches how Vite proxies /api in development).

# Docker's embedded DNS. Resolving upstreams per request — via the $frontend and
# $backend variables below — means a restarted container is picked up without
# restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limit for the two public writes: a submission and a contact message.
# Both are unauthenticated, so nothing but this stands between the archive and a
# script with a loop in it.
#
# Only POSTs are counted. An empty key is nginx's way of exempting a request, so
# this map leaves every GET — the wall, the images, an entry — untouched while
# the same location still handles it.
map $request_method $write_ip {
    POST    $binary_remote_addr;
    default "";
}

# Ten a minute per IP, with a small burst for a retry or a double tap. Far above
# what a person does and far below what a script wants. The key is the address
# nginx sees: behind a further proxy that is the proxy, not the visitor — the
# same caveat TRUST_PROXY_HEADERS carries in the README.
limit_req_zone $write_ip zone=public_write:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Uploads are capped at 10 MB by the API; leave headroom for the multipart
    # envelope so the API returns its own error rather than an nginx 413.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Liveness for the host or an uptime check, answered without touching the app.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The two public writes, rate limited. Exact matches, so nothing deeper —
    # /api/entries/<id>/image and the rest — is caught by them. The proxy
    # settings are repeated verbatim from /api/ below because an nginx location
    # inherits nothing from a sibling; keep the three in step.
    location = /api/entries {
        limit_req zone=public_write burst=3 nodelay;

        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /api/messages {
        limit_req zone=public_write burst=3 nodelay;

        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image responses stream out of MinIO through the API; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

