# Single-server production stack. Only nginx is published to the host; Postgres,
# MinIO, the API and the static frontend stay on the internal network.
#
#   cp .env.prod.example .env    # then fill in the secrets
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Images are built and pushed by .github/workflows/docker-images.yml. Set
# IMAGE_TAG to pin a release; the default tracks main.
#
# Sized for a 1 GB / 1 vCPU host (a Linode Nanode, a Hetzner CX22 with room to
# spare). Every service carries a mem_limit, and the ones that run all the time
# come to ~832 MB, leaving the rest for the kernel and dockerd. The limits are
# what turn "the box died" into "one container was restarted", so keep them even
# on a larger machine — raise the numbers instead of removing them.
#
# Two of those limits are headroom rather than usage: certbot is a sleeping shell
# for all but a few seconds a day, and init-certs exits before nginx starts.
#
# NOTE: never build on a 1 GB host. The frontend's Vite build alone wants more
# than the whole machine. These images are pulled, which is why it works.

# Docker's default json-file driver never rotates, and an unnoticed error loop
# will fill a small disk with its own logs. Capped at 30 MB a service.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default_logging
    image: postgres:16-alpine
    # Tuned down from defaults that assume a much bigger machine. max_connections
    # has to stay above the API's pool ceiling (DB_POOL_SIZE + DB_MAX_OVERFLOW,
    # 10 by default) with room left for a migration and a psql session.
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=48MB
      -c effective_cache_size=128MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_worker_processes=2
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stickers}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stickers}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${POSTGRES_MEM:-160m}
    restart: unless-stopped

  minio:
    logging: *default_logging
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      # MinIO is Go, and Go's collector will happily grow to whatever the host
      # has. GOMEMLIMIT makes it collect against a target instead — set below
      # mem_limit so the GC reacts before the kernel's OOM killer does.
      GOMEMLIMIT: ${MINIO_GOMEMLIMIT:-180MiB}
      # Bound the request buffers a burst can allocate.
      MINIO_API_REQUESTS_MAX: ${MINIO_API_REQUESTS_MAX:-32}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${MINIO_MEM:-224m}
    restart: unless-stopped

  init-db:
    logging: *default_logging
    image: ${IMAGE_REPO:-ghcr.io/ofryma/sticker-song}/backend:${IMAGE_TAG:-main}
    command: ["python", "-m", "app.init_infra"]
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stickers}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stickers}
      MINIO_SECURE: "false"
      # Same-origin behind nginx, so CORS is only a fallback. JSON list, and the
      # origin is derived from DOMAIN so it cannot drift from what nginx serves.
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Sign-in for the /admin review page. Without these nobody can publish.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REQUIRE_REVIEW: ${REQUIRE_REVIEW:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REVIEW_MODEL: ${REVIEW_MODEL:-claude-opus-5}
      THUMBNAIL_MAX_EDGE: ${THUMBNAIL_MAX_EDGE:-640}
      DUPLICATE_VOTE_THRESHOLD: ${DUPLICATE_VOTE_THRESHOLD:-20}
      NAME_SIMILARITY_THRESHOLD: ${NAME_SIMILARITY_THRESHOLD:-0.4}
      IMAGE_FORMAT: ${IMAGE_FORMAT:-webp}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-88}
      # The two knobs that bound peak memory during an upload: how large a frame
      # may be decoded, and how many may be decoded at once. 50 MP x 3 bytes is
      # ~150 MB, so at a concurrency of 2 the worst case sits inside the limit
      # below. Lower either one before raising the container's memory.
      MAX_IMAGE_MEGAPIXELS: ${MAX_IMAGE_MEGAPIXELS:-50}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      # Real client IPs arrive as X-Forwarded-For from the nginx edge only.
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: ${BACKEND_MEM:-288m}
    restart: "no"

  backend:
    logging: *default_logging
    image: ${IMAGE_REPO:-ghcr.io/ofryma/sticker-song}/backend:${IMAGE_TAG:-main}
    environment: *backend_env
    expose:
      - "8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
    # python:3.12-slim ships no curl or wget, so the check is python itself.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${BACKEND_MEM:-288m}
    restart: unless-stopped

  frontend:
    logging: *default_logging
    image: ${IMAGE_REPO:-ghcr.io/ofryma/sticker-song}/frontend:${IMAGE_TAG:-main}
    expose:
      - "80"
    mem_limit: ${FRONTEND_MEM:-24m}
    restart: unless-stopped

  # Makes sure nginx has a certificate to start against, on every `up`. Either
  # the real one, copied out of certbot's tree — which is also how a certificate
  # issued while the stack was down gets picked up — or, on a box that has none
  # yet, a self-signed placeholder. The placeholder is what lets TLS be
  # unconditional: nginx boots, answers the HTTP-01 challenge on port 80, and
  # `make prod-cert` replaces the placeholder with the real thing.
  #
  # certbot/certbot is used for the openssl binary, which nginx:alpine lacks; the
  # image is already needed for renewals, so this adds nothing to pull.
  init-certs:
    logging: *default_logging
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        live="/etc/letsencrypt/live/$${DOMAIN}"
        if [ -f "$$live/fullchain.pem" ]; then
          cp -L "$$live/fullchain.pem" /certs/fullchain.pem
          cp -L "$$live/privkey.pem"   /certs/privkey.pem
          chmod 600 /certs/privkey.pem
          echo "certs: installed the Let's Encrypt certificate for $${DOMAIN}"
        elif [ -f /certs/fullchain.pem ]; then
          echo "certs: keeping the certificate already in place"
        else
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 \
            -subj "/CN=$${DOMAIN}" \
            -addext "subjectAltName=DNS:$${DOMAIN},DNS:www.$${DOMAIN}" \
            -keyout /certs/privkey.pem -out /certs/fullchain.pem 2>/dev/null
          chmod 600 /certs/privkey.pem
          echo "certs: no certificate for $${DOMAIN} yet — wrote a self-signed placeholder."
          echo "certs: browsers will warn until you run, on this box:"
          echo "certs:   make prod-cert EMAIL=you@example.org"
        fi
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx/certs:/certs
    mem_limit: 64m
    restart: "no"

  # Renewal, without a cron entry on the host: certbot wakes twice a day and
  # exits quietly unless the certificate is inside its 30-day window. The
  # challenge goes through the running nginx via the shared webroot, so no port
  # has to be freed, and the deploy hook copies the new files where nginx reads
  # them. nginx picks them up on its own reload loop below.
  #
  # Idle cost is a sleeping shell — certbot itself only exists for the seconds it
  # runs, which is what the limit is sized for.
  certbot:
    logging: *default_logging
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook 'cp -L "$$RENEWED_LINEAGE/fullchain.pem" /certs/fullchain.pem && cp -L "$$RENEWED_LINEAGE/privkey.pem" /certs/privkey.pem && chmod 600 /certs/privkey.pem' \
            || echo "certbot: renew failed; will try again in 12h"
          sleep 12h
        done
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx/certs:/certs
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx
    mem_limit: ${CERTBOT_MEM:-96m}
    restart: unless-stopped

  nginx:
    logging: *default_logging
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # The domain reaches the config through the image's own template rendering:
    # /etc/nginx/templates/*.template is envsubst'd into /etc/nginx/conf.d at
    # startup. conf.d is therefore left writable and container-local — the
    # rendered output, not something to mount. The filter is what stops envsubst
    # from eating nginx's own $host and $request_uri: only DOMAIN is substituted.
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/include:/etc/nginx/include:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    # Reload every six hours so a renewed certificate is served without anyone
    # touching the box. A reload is cheap, and the window is far inside the 30
    # days certbot renews with in hand. The entrypoint is called explicitly
    # because it only renders templates when its first argument is `nginx`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (while :; do sleep 6h; nginx -s reload; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      init-certs:
        condition: service_completed_successfully
      backend:
        condition: service_started
      frontend:
        condition: service_started
    mem_limit: ${NGINX_MEM:-40m}
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  certbot_webroot:
