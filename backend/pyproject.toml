[project]
name = "sticker-song-backend"
version = "0.1.0"
description = "Memorial sticker documentation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "minio>=7.2.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.20.0",
    "anthropic>=0.75.0",
    # Already present under anthropic; declared because app/notify.py imports it.
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests need Postgres with pg_trgm; they skip themselves when
# TEST_DATABASE_URL points at nothing reachable.
markers = ["integration: needs a live Postgres (see tests/conftest.py)"]
filterwarnings = [
    # FastAPI's on_event is deprecated but still what app/main.py uses.
    "ignore:\\s*on_event is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixtures shadow their own names by design, and tests assert on private helpers.
"tests/*" = ["B008"]
